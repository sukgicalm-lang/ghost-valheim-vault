name: Diagnose native Windows launcher updater
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-updater.yml'
      - 'updater-diagnostics/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-handshake:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact current source and diagnostic compiler
        shell: powershell
        run: |
          python release-ci/bootstrap.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix updater-diagnostics typescript@5.9.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run exact shipped helper with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          node updater-diagnostics/verify-native-update.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
