name: Add VehicleRemoval to Ghost required mods
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-vehicle-removal.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify official package and register it in Ghost launcher catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          name='DEEP_FROST-VehicleRemoval'
          version='1.6.0'
          url=f'https://gcdn.thunderstore.io/live/repository/packages/{name}-{version}.zip'
          with urllib.request.urlopen(url, timeout=90) as response:
              raw=response.read()
          assert len(raw)>1000 and zipfile.is_zipfile(io.BytesIO(raw)), 'Official mod package invalid'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None, 'Official ZIP damaged'
              manifests=[n for n in z.namelist() if n.endswith('manifest.json') and n.count('/')<=1]
              assert manifests, 'No manifest'
              manifest=json.loads(z.read(sorted(manifests,key=len)[0]))
          assert manifest['name']=='VehicleRemoval'
          assert manifest['version_number']==version
          dependencies=manifest.get('dependencies',[])
          assert all(isinstance(d,str) for d in dependencies)
          path=pathlib.Path('docs/setup-release.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          existing=[p for p in data['packages'] if p['name']==name]
          assert not existing, 'VehicleRemoval already registered; no automatic overwrite'
          assert len(data['packages'])==28, 'Unexpected baseline; review first'
          item={
            'name':name,
            'version':version,
            'bytes':len(raw),
            'sha256':hashlib.sha256(raw).hexdigest(),
            'dependencies':dependencies,
            'description':'망치로 드라카 등 배와 수레를 해체하고 제작 재료를 전량 돌려받습니다. 작업대가 근처에 있어야 하며 탑승자가 있으면 해체하지 않습니다.'
          }
          position=next((i for i,p in enumerate(data['packages']) if p['name'].startswith('Ghost-')),len(data['packages']))
          data['packages'].insert(position,item)
          data['revision']=max(data['revision']+1,3)
          data['date']='2026-11-04'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          htmlpath=pathlib.Path('docs/install.html')
          html=htmlpath.read_text(encoding='utf-8')
          html=html.replace('28개','29개')
          htmlpath.write_text(html,encoding='utf-8')
          # Keep the existing feed regression test aligned with the appended, verified package.
          testpath=pathlib.Path('release-ci/test-setup-feed.cjs')
          t=testpath.read_text(encoding='utf-8')
          t=t.replace("const retired='Voidey-WoWArmors';", "const retired='Voidey-WoWArmors'; const added='DEEP_FROST-VehicleRemoval';")
          t=t.replace("assert.equal(published.revision,2)", "assert.equal(published.revision,3)")
          t=t.replace("assert.equal(setup.revision,2)", "assert.equal(setup.revision,3)")
          t=t.replace("assert.equal(published.packages.length,28)", "assert.equal(published.packages.length,29)")
          t=t.replace("assert.equal(setup.packages.length,28)", "assert.equal(setup.packages.length,29)")
          t=t.replace("assert.equal(core.orderSetupPackages(setup.packages).length,28)", "assert.equal(core.orderSetupPackages(setup.packages).length,29)")
          t=t.replace("assert.equal(plan.install.length,28)", "assert.equal(plan.install.length,29)")
          t=t.replace("assert.equal(bundled.setup.packages.length,29)", "assert.equal(bundled.setup.packages.length,29)")
          t=t.replace("JSON.stringify(bundled.setup.packages.filter(p=>p.name!==retired))", "JSON.stringify([...bundled.setup.packages.filter(p=>p.name!==retired),...published.packages.filter(p=>p.name===added)])")
          t=t.replace("assert.ok(guide.includes('28개'));", "assert.ok(guide.includes('29개'));")
          t=t.replace("assert.ok(!guide.includes('29개'));", "assert.ok(!guide.includes('28개'));")
          t=t.replace("assert.ok(!guide.includes('전체 29개'));", "assert.ok(!guide.includes('전체 28개'));")
          t=t.replace("published,cached", "published,cached")
          t=t.replace("revision 2", "revision 3").replace("28 packages", "29 packages").replace("28개", "29개")
          testpath.write_text(t,encoding='utf-8')
          print('Registered:',item)
          PY
      - name: Commit only launcher setup list, website count and feed test
        run: |
          git config user.name "ghost-launcher-bot"
          git config user.email "ghost-launcher-bot@users.noreply.github.com"
          git add docs/setup-release.json docs/install.html release-ci/test-setup-feed.cjs
          git diff --cached --check
          git commit -m "Add verified VehicleRemoval 1.6.0 to Ghost automatic setup"
          git push
