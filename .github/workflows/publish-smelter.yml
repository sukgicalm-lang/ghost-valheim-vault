name: Publish Ghost launcher and required setup
on:
  push:
    branches: [main]
    paths:
      - 'release-ci/**'
      - '.github/workflows/publish-smelter.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ghost-smelter-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Build only a new immutable launcher version
        shell: python
        run: |
          import json, os
          from pathlib import Path
          patch = json.loads(Path('release-ci/launcher-patch.json').read_text())
          package = json.loads(next(row['content'] for row in patch if row['path'] == 'package.json'))
          live = json.loads(Path('docs/client-release.json').read_text())
          source_version = tuple(map(int, package['version'].split('.')))
          live_version = tuple(map(int, live['version'].split('.')))
          if source_version < live_version:
              raise RuntimeError('Launcher source is older than the published runtime')
          publish = source_version > live_version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('publish=' + str(publish).lower() + '\n')
          print('New launcher build required:', publish)
  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true' && github.repository == 'sukgicalm-lang/ghost-valheim-vault'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release inputs and prepare launcher
        shell: pwsh
        run: |
          python release-ci/bootstrap.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release-ci/generate-launcher-patch.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- release-ci/launcher-patch.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python release-ci/verify-setup.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --global pnpm@11.8.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install pinned launcher dependencies
        shell: pwsh
        working-directory: _smelter_build/launcher
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm exec quasar prepare
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Typecheck and verify both Ghost update paths
        shell: pwsh
        working-directory: _smelter_build/launcher
        run: |
          pnpm typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:GHOST_PACK_FIXTURE = (Resolve-Path ../smelter-fixture).Path
          $env:GHOST_SETUP_FIXTURES = (Resolve-Path ../setup-fixtures).Path
          pnpm exec vitest run --config ghost.vitest.config.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify shipped Windows self-update helper
        shell: pwsh
        run: ./release-ci/test-self-update.ps1
      - name: Build and verify single-file native installer
        shell: powershell
        run: ./release-ci/build-native-setup.ps1
      - name: Verify real native parent exit and restart
        shell: powershell
        run: |
          node updater-diagnostics/verify-native-update.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows Ghost r2 1.0.12 and verify actual app archive
        shell: pwsh
        working-directory: _smelter_build/launcher
        run: |
          $env:SKIP_PACKING = 'true'
          pnpm exec quasar build --mode electron -T win32
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item ../assets/GhostR2-Setup-1.0.12.exe dist/electron/Packaged/win-unpacked/resources/GhostR2Updater.exe
          node scripts/check-ghost-release.cjs . dist/electron/Packaged/win-unpacked/resources/app.asar
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package final assets and publish to existing repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python release-ci/package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./release-ci/publish.ps1

