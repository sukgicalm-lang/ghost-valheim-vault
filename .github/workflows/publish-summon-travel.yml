name: Verify and publish Ghost skeleton dismissal
on:
  push:
    branches: [main]
    paths:
      - 'mod-ci/summontravel-1.0.14/**'
      - 'mod-src/SummonTravel/**'
      - 'mod-src/SummonTravel.Tests/**'
      - '.github/workflows/publish-summon-travel.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ghost-smelter-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sukgicalm-lang/ghost-valheim-vault'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test inventory dismissal, skeleton lifecycle and shields
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project mod-src/SummonTravel.Tests/Behavior.csproj --configuration Release | tee mod-ci/summontravel-1.0.14/behavior-results.txt
      - name: Build real Harmony refresh regression harness
        run: dotnet build mod-src/SummonTravel.Tests/Runtime/RuntimeRecastIntegration.csproj --configuration Release
      - name: Verify runtime fall absorption, replacement and shield recast
        shell: bash
        run: |
          set -o pipefail
          dotnet mod-src/SummonTravel.Tests/Runtime/bin/Release/net8.0/RuntimeRecastIntegration.dll | tee mod-ci/summontravel-1.0.14/runtime-results.txt
      - name: Preserve prior modules and publish verified suite before update feed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: python mod-ci/summontravel-1.0.14/publish.py
